<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-scaffold</title>
    <!--
      Pretendard 폰트 — index.css의 @import 대신 여기서 <link>로 로드한다. CSS @import는
      JS 번들이 index.css를 불러온 뒤에야(module 스크립트 실행 시점) 브라우저가 발견하는데,
      아래 VWorld 스크립트가 document.write로 파싱 자체를 막고 있어서 그 시점이 VWorld 로딩이
      다 끝난 뒤로 밀린다 — 그동안 시스템 기본 폰트로 먼저 그려지고(칩·버튼처럼 텍스트
      길이로 폭이 정해지는 요소들이 그 폭으로 자리잡음) 뒤늦게 Pretendard로 교체되면서
      크기가 눈에 띄게 바뀌었다(2026-09-14 실제 재현). <link>는 이 스크립트보다 먼저 두면
      HTML 파싱이 시작되자마자(VWorld와 무관하게 병렬로) 요청이 나가 교체가 훨씬 빨라진다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <!--
      VWorld 3D 지도 SDK — 관리자(/admin)·스태프(/staff) 둘 다 지도 화면이 있어서 두 경로
      모두에서 로드한다. "/"(공통 진입)·/demo 자체 문서(iframe 두 개를 담는 껍데기일 뿐 지도를
      직접 그리진 않음)에서는 안 불러온다.

      /demo는 /admin·/staff를 각각 완전히 새 문서로(iframe) 띄우므로, 이 둘을 동시에 보면
      SDK가 두 iframe에서 동시에 로드된다 — 둘 다 실제로 지도가 필요해서 이건 정상이고
      피할 수 없다(네트워크·CPU를 나눠 쓰는 정도의 비용은 감수). 그래도 필요 없는 "/"에서는
      막아서 최소한의 낭비는 줄인다.

      반드시 document.write()로 넣는다(동적 <script> 주입 X) — 이 SDK는 내부에서도
      document.write()로 자기 하위 의존성을 주입하는데, 그게 "이미 파싱이 끝난 문서"에서
      실행되면(=일반적인 JS 동적 주입, 혹은 이 판단 자체를 비동기 코드에서 하면) 조용히
      깨진다(2026-09-14 실제 재현: "Failed to execute 'write' on 'Document'"로 Cesium/ws3d
      전역이 아예 안 생김). 그래서 이 판단·삽입 자체를 "문서가 아직 파싱 중"인 동기 인라인
      스크립트 안에서 document.write로 해야 한다.

      %VITE_VWORLD_API_KEY%는 Vite의 index.html 환경변수 치환 — frontend/.env의 값으로
      빌드·개발 서버 시작 시 채워진다(코드에 키를 하드코딩하지 않음).
    -->
    <script>
      if (location.pathname === '/admin' || location.pathname === '/staff') {
        document.write(
          '<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=%VITE_VWORLD_API_KEY%"><\/script>',
        )
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
